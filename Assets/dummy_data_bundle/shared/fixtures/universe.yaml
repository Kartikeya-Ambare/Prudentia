# Canonical prototype universe — 13 instruments (within the 10-15 cap from CLAUDE.md §6.1).
# Every fixture file in /shared/fixtures uses EXACTLY these identifiers. This is what lets
# five people build mock data independently and still have it line up on merge day — nobody
# invents their own ticker list, everybody points at this one file.
#
# When the project later scales past 100 instruments (CLAUDE.md §6.1), only this file changes.

stocks:
  - ticker: TCS.NS
    name: Tata Consultancy Services
    sector: IT
  - ticker: INFY.NS
    name: Infosys
    sector: IT
  - ticker: HDFCBANK.NS
    name: HDFC Bank
    sector: Banking
  - ticker: ICICIBANK.NS
    name: ICICI Bank
    sector: Banking
  - ticker: RELIANCE.NS
    name: Reliance Industries
    sector: Energy
  - ticker: ITC.NS
    name: ITC Limited
    sector: FMCG
  - ticker: SUNPHARMA.NS
    name: Sun Pharmaceutical
    sector: Pharma
  - ticker: MARUTI.NS
    name: Maruti Suzuki
    sector: Auto

mutual_funds:
