name: CI

# Proves that a fresh clone sets itself up and runs on Windows, macOS and Linux:
# run.py creates the environments, installs everything, starts the services and checks them.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  setup-test-run:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up (virtual environments and packages)
        run: python run.py --setup-only --skip-ollama

      - name: Backend tests
        shell: bash
        run: |
          PY=backend/.venv/bin/python; [ -x "$PY" ] || PY=backend/.venv/Scripts/python.exe
          cd backend && "../$PY" -m pytest -q

      - name: Chat service tests
        shell: bash
        run: |
          PY=chat-service/.venv/bin/python; [ -x "$PY" ] || PY=chat-service/.venv/Scripts/python.exe
          cd chat-service && "../$PY" -m pytest -q

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Start everything and check it (no Ollama on the runner)
        run: python run.py --smoke --skip-ollama --no-browser

      - name: Upload logs if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-py${{ matrix.python }}
          path: logs/

  deploy-bundle:
    # Proves the Docker deployment builds and serves: the images build, and through the one public address the page loads,
    # the backend answers and the chat replies (small talk needs no language model, so Ollama is left out here).
    name: docker compose build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build the images
        run: docker compose build

      - name: Start backend, chat and web
        run: docker compose up -d --no-deps backend chat web

      - name: Check it through the public address
        run: |
          for i in $(seq 1 60); do curl -fs http://localhost/api/health >/dev/null && break; sleep 5; done
          curl -fs http://localhost/api/health
          curl -fs http://localhost/ | grep -qi "<div id=\"root\""
          curl -fs http://localhost/stocks | grep -qi "<div id=\"root\""
          curl -fs -X POST http://localhost/chat-api/chat -H 'content-type: application/json' \
            -d '{"session_id":"ci","message":"hi"}' | grep -qi "Prudie"
          curl -fs -X POST http://localhost/api/plan -H 'content-type: application/json' \
            -d '{"capital":500000,"horizon_years":5,"risk_thermometer":50}' | grep -q "profile_id"

      - name: Show the logs if something failed
        if: failure()
        run: docker compose logs --no-color --tail=100
