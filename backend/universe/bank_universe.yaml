# Bank universe for the FD/deposit leg.
# rate_pct is a static seed; download.py's FD-rate lookup refreshes it
# monthly and writes actuals into the bank_rates table —
# these values are only the fallback used before the first refresh.
#
# "major" tier = the 10 nationalized (PSU) banks + the top 5-6 private banks
# by size, per the project's bank-selection scope. "category" is informational
# only (nationalized vs. private) and isn't read by bank_selector.py.
